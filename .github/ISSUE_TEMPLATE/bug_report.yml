name: Bug report
description: Report a problem with a @jev-harness package
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the report. For security issues, do **not** open a public
        issue — see [SECURITY.md](../blob/master/SECURITY.md).
  - type: input
    id: package
    attributes:
      label: Affected package
      description: Which @jev-harness/* package (or jev-py) is affected?
      placeholder: "@jev-harness/core"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version where you saw the problem.
      placeholder: "0.2.1"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps, code, or a repo that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "20 / 22 / 24"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any credentials before pasting.
      render: shell
    validations:
      required: false
