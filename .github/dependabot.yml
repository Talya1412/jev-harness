version: 2
updates:
  # Root npm workspace (covers every packages/* workspace through the lockfile).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # jev-py is a standalone Python package (not an npm workspace).
  - package-ecosystem: pip
    directory: "/packages/jev-py"
    schedule:
      interval: weekly
