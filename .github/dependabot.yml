version: 2
updates:
  # Root npm workspace (covers every packages/* workspace through the lockfile).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/node must track the minimum supported runtime (Node >= 20), not
      # the newest release: newer majors typecheck APIs absent on Node 20/22/24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # jev-py is a standalone Python package (not an npm workspace).
  - package-ecosystem: pip
    directory: "/packages/jev-py"
    schedule:
      interval: weekly
