# Secret scanning configuration.
#
# packages/eval/golden/ holds labeled evaluation fixtures, including a handful of
# deliberately credential-shaped strings used to measure the `secret_leak`
# question (see merge-gate.json). They avoid live provider prefixes on purpose,
# but they are still shaped like secrets, so keep them out of secret scanning
# rather than teaching every contributor the push-protection bypass.
paths-ignore:
  - "packages/eval/golden/**"
