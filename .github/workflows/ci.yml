name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: this workflow only reads the repo and runs tests.
permissions:
  contents: read

# A newer push on the same ref supersedes earlier runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Formatting and linting are platform-independent; one runner is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Informational only: report vulnerable production deps without failing
      # the build — Dependabot owns the remediation path.
      - name: Dependency audit (informational)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Install the package's dev extra so the declared pytest constraint is
      # actually exercised, instead of a floating `pip install pytest`.
      - run: python -m pip install -e "packages/jev-py[dev]"
      - name: jev-py test suite (includes TS parity fixtures)
        run: python -m pytest packages/jev-py/tests -q

  bundle-drift:
    # The committed bundles below are consumed directly (OMP loads
    # packages/omp/bundle; the Claude Code marketplace and the GitHub
    # Actions consume their dist/ entrypoints), so a stale bundle must fail CI.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Root build orders core -> kit -> eval -> all workspaces, so
      # @jev-harness/core dist exists before the adapters bundle it.
      - run: npm run build
      - name: Fail on stale committed bundles
        run: |-
          git diff --exit-code -- \
            packages/omp/bundle \
            packages/claude-code/dist \
            packages/claude-code/.claude-plugin \
            packages/github/dist \
            packages/pr-triage-action/dist/index.js \
            packages/jev-gate-action/dist/index.js
