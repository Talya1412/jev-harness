name: live-eval

# Manual calibration run against the real Jev API. Re-runs each benchmark
# dataset and fails on quality regressions against its committed baseline —
# both the aggregate and every gated slice. Requires TYPESAFE_API_KEY.
#
# Every entry pairs a dataset with ONE baseline, because a dataset can ask
# several questions (merge-gate asks two) and each gets its own recording:
#   destructive-gate           dev / tuning split (wording may be iterated here)
#   destructive-gate.holdout   holdout — regression reference, never tuned against
#   merge-gate                 the diffs jev-gate-action judges on a PR
on:
  workflow_dispatch:

permissions:
  contents: read

# Manual runs only; serialize them so two calibrations never race.
concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: destructive-gate
            baseline: destructive-gate.baseline.json
          - dataset: destructive-gate.holdout
            baseline: destructive-gate.holdout.baseline.json
          - dataset: merge-gate
            baseline: merge-gate.destructive.baseline.json
          - dataset: merge-gate
            baseline: merge-gate.secret-leak.baseline.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@jev-harness/core --if-present
      - run: npm run build --workspace=@jev-harness/eval --if-present
      # packages/eval/dist is gitignored: the two build steps above must run first.
      # Low concurrency on purpose — the API sits behind Cloudflare, which answers
      # a burst with a 403 challenge rather than a 429.
      - name: Run the golden dataset against the live API
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: >
          node packages/eval/dist/bin.js
          --dataset packages/eval/golden/${{ matrix.dataset }}.json
          --concurrency 3
          --out report-${{ matrix.baseline }}
      - name: Compare against the committed baseline (aggregate + slices)
        run: >
          node packages/eval/scripts/check-regression.mjs
          report-${{ matrix.baseline }}
          packages/eval/golden/${{ matrix.baseline }}
      - name: Upload the fresh report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-${{ matrix.baseline }}
          path: report-${{ matrix.baseline }}
