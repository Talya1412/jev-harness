name: live-eval

# Manual calibration check against the real Jev API. Compares a fresh run
# of the golden datasets with the committed baseline; fails on quality
# regressions (AUC or accuracy drop). Requires the TYPESAFE_API_KEY secret.
on:
  workflow_dispatch:

permissions:
  contents: read

# Manual runs only; serialize them so two calibrations never race.
concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@jev-harness/core --if-present
      - run: npm run build --workspace=@jev-harness/eval --if-present
      # packages/eval/dist is gitignored: the two build steps above must run first.
      - name: Run golden datasets against the live API
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node packages/eval/dist/bin.js --dataset packages/eval/golden/destructive-gate.json --out report.json
      - name: Compare against the committed baseline
        run: node packages/eval/scripts/check-regression.mjs report.json packages/eval/golden/destructive-gate.baseline.json
      - name: Upload the fresh report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: report.json
