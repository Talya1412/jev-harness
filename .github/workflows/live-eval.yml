name: live-eval

# Manual calibration run against the real Jev API. Re-runs the benchmark
# datasets and fails on quality regressions against the committed baselines —
# both the aggregate and every gated slice. Requires the TYPESAFE_API_KEY secret.
#
# The two datasets are different things and are kept apart on purpose:
#   destructive-gate          dev / tuning split (wording may be iterated on it)
#   destructive-gate.holdout  holdout — never used to choose wording
on:
  workflow_dispatch:

permissions:
  contents: read

# Manual runs only; serialize them so two calibrations never race.
concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - destructive-gate
          - destructive-gate.holdout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@jev-harness/core --if-present
      - run: npm run build --workspace=@jev-harness/eval --if-present
      # packages/eval/dist is gitignored: the two build steps above must run first.
      # Low concurrency on purpose — the API sits behind Cloudflare, which
      # answers a burst with a 403 challenge rather than a 429.
      - name: Run the golden dataset against the live API
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: >
          node packages/eval/dist/bin.js
          --dataset packages/eval/golden/${{ matrix.dataset }}.json
          --concurrency 3
          --out report-${{ matrix.dataset }}.json
      - name: Compare against the committed baseline (aggregate + slices)
        run: >
          node packages/eval/scripts/check-regression.mjs
          report-${{ matrix.dataset }}.json
          packages/eval/golden/${{ matrix.dataset }}.baseline.json
      - name: Upload the fresh report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-${{ matrix.dataset }}
          path: report-${{ matrix.dataset }}.json
