name: PR triage (Jev)

# Dogfoods packages/pr-triage-action on our own pull requests. Without the
# TYPESAFE_API_KEY secret the action skips with a notice (fail-open), so
# enabling this workflow is always safe.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./packages/pr-triage-action
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
