name: release

# Version + publish via changesets. A "Version Packages" PR opens whenever
# *.changeset/ files land on master; merging it publishes the changed
# packages to npm with provenance.
#
# Owner setup required before this workflow can succeed:
#  1. NPM_TOKEN repository secret (npm token with publish rights to
#     @jev-harness) — or configure npm Trusted Publishing per package and
#     drop the token entirely.
#  2. Repo Settings → Actions → General → "Allow GitHub Actions to create
#     and approve pull requests" must be ON.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --include=dev
      # Commit Version Packages as the repo owner, not github-actions[bot].
      - run: |-
          git config user.name "Talya1412"
          git config user.email "99625225+Talya1412@users.noreply.github.com"
      # changesets/action@v2 renamed its inputs and no longer accepts the
      # token through the GITHUB_TOKEN environment variable — it must be
      # passed through the `github-token` input.
      - uses: changesets/action@v2
        with:
          version-script: npm run changeset:version
          publish-script: npm run release
          pr-title: Version Packages
          commit-message: Version Packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
