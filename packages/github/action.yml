name: jev-review
description: A Jev-driven pull-request review — routes the right reviewer and flags destructive changes. Advisory only; never blocks.
author: jev-harness
branding:
  icon: shield
  color: blue

inputs:
  typesafe-api-key:
    description: TypeSafe Jev API key (console.typesafe.ai). If unset, the action posts a fail-open comment and never fails the run.
    required: false
  pr-number:
    description: Pull-request number to comment on. Defaults to the event's number.
    required: false
  pr-title:
    description: PR title. Defaults to github.event.pull_request.title.
    required: false
  pr-body:
    description: PR body. Defaults to github.event.pull_request.body.
    required: false
  pr-diff:
    description: The diff text to judge. If unset, `git diff origin/HEAD...` is used.
    required: false
  reviewers:
    description: JSON array of {name, description} reviewer candidates. Defaults to auto/peer/security/perf.
    required: false
  post:
    description: Whether to post the comment via gh (set to 'false' to only print it).
    required: false
    default: "true"
  destructive-threshold:
    description: Override the destructive-block threshold (default 0.75).
    required: false

runs:
  using: node20
  main: dist/action.js
