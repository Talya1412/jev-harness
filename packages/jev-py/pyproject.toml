[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-harness"
version = "0.1.0"
description = "TypeSafe Jev (System One) integrations for Python: async client, primitives, reusable patterns, eval + tuning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "jev-harness contributors" }]
keywords = ["jev", "typesafe", "system-one", "calibration", "llm", "agent"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # zero runtime deps: stdlib urllib + asyncio only

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
jev-tune = "jev_harness.eval.cli:main"

[project.urls]
Source = "https://github.com/Talya1412/jev-harness"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
